[project]
name = "trackforge-api"
version = "1.0.0"
description = "TrackForge personal DSA progress API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.2",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "prometheus-client==0.26.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires an external service such as PostgreSQL",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 55

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.vercel]
entrypoint = "app.main:app"
